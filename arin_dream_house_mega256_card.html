<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Arin's Dream House Studio — 6 Rooms Interior Decorator!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3D2B24;
    --ink-soft: #6B4F43;
    --pink-pop: #FF6FA5;
    --yellow-pop: #FDE047;
    --mint-pop: #6EE7B7;
    --sky-pop: #BAE6FD;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    font-family: 'Fredoka', 'Nunito', sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #FCE7F3 0%, #FEF9C3 50%, #E0F2FE 100%);
    overflow: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(3px, 0.8vh, 12px) clamp(5px, 1vw, 16px);
  }

  .room-book {
    width: 100%;
    max-width: 1380px;
    height: 100%;
    max-height: 860px;
    background: linear-gradient(180deg, #FFFDF8 0%, #FFF7FA 55%, #F0F9FF 100%);
    border: clamp(2.5px, 0.35vw, 4px) solid var(--ink);
    border-radius: clamp(16px, 2.2vw, 28px);
    box-shadow: 0 clamp(4px, 0.7vh, 8px) 0 var(--ink), 0 14px 30px rgba(61, 43, 36, 0.16);
    padding: clamp(5px, 0.9vh, 12px) clamp(7px, 1.2vw, 18px);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 0.75vh, 9px);
  }

  @media (orientation: portrait) and (max-width: 720px) {
    html, body { overflow-y: auto; height: auto; }
    body { align-items: flex-start; padding: 8px; }
    .room-book { height: auto; max-height: none; overflow: visible; }
  }

  .header-wrapper {
    position: relative;
    z-index: 2;
    border-radius: clamp(12px, 1.6vw, 20px);
    border: clamp(2px, 0.28vw, 3px) solid var(--ink);
    background: linear-gradient(90deg, #FBCFE8 0%, #FEF08A 50%, #BAE6FD 100%);
    padding: clamp(3px, 0.6vh, 7px) clamp(8px, 1.2vw, 15px);
    overflow: hidden;
    flex-shrink: 0;
  }

  .header-bar {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }

  .room-tag {
    background: #FFFFFF;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 0 var(--ink);
    border-radius: 999px;
    padding: clamp(2px, 0.4vh, 4px) clamp(7px, 1vw, 12px);
    font-size: clamp(0.6rem, min(1.1vw, 1.95vh), 0.86rem);
    font-weight: 700;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .puffy-title {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: clamp(0.82rem, min(2.05vw, 3.3vh), 1.58rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #FF6FA5;
    white-space: nowrap;
    text-shadow:
      -1.5px -1.5px 0 var(--ink),
       1.5px -1.5px 0 var(--ink),
      -1.5px  1.5px 0 var(--ink),
       1.5px  1.5px 0 var(--ink),
       0px    2.5px 0 var(--ink);
  }

  .puffy-title span.gold { color: #FDE047; }
  .puffy-title span.mint { color: #6EE7B7; }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .sticker-btn {
    background: #FFF3B0;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 0 var(--ink);
    border-radius: 999px;
    padding: clamp(2px, 0.4vh, 4px) clamp(6px, 0.95vw, 11px);
    font-family: inherit;
    font-size: clamp(0.6rem, min(1.05vw, 1.85vh), 0.82rem);
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s;
  }

  .sticker-btn:active { transform: translateY(1px); }
  .sticker-btn.pink { background: #FFD6E5; }
  .sticker-btn.mint { background: #CCFBF1; }
  .sticker-btn.sky { background: #BAE6FD; }

  .two-pane {
    position: relative;
    z-index: 2;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(310px, 47%) 1fr;
    gap: clamp(7px, 1.2vw, 15px);
    align-items: stretch;
  }

  @media (orientation: portrait) and (max-width: 720px) {
    .two-pane { grid-template-columns: 1fr; }
    .header-bar { flex-wrap: wrap; justify-content: center; }
  }

  /* ================= LEFT PANE: ARIN'S LIVE ROOM STAGE ================= */
  .left-pane {
    background: linear-gradient(180deg, #FFFDF7 0%, #FFF5FA 100%);
    border: clamp(2.5px, 0.35vw, 3.5px) solid var(--ink);
    border-radius: clamp(16px, 2vw, 26px);
    box-shadow: 0 4px 0 var(--ink);
    padding: clamp(5px, 0.9vh, 11px) clamp(7px, 1vw, 13px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: clamp(3px, 0.65vh, 7px);
    min-height: 0;
    overflow: hidden;
  }

  .cloud-speech {
    background: #FFFFFF;
    border: 2px solid var(--ink);
    box-shadow: 0 2px 0 #FBCFE8;
    border-radius: 14px;
    padding: clamp(3px, 0.6vh, 6px) clamp(6px, 0.9vw, 11px);
    font-size: clamp(0.64rem, min(1.15vw, 2vh), 0.88rem);
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    width: 100%;
    flex-shrink: 0;
    line-height: 1.2;
  }

  .cloud-speech.pop { animation: stickerPop 0.35s ease; }

  @keyframes stickerPop {
    0% { transform: scale(0.95); }
    55% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .room-stage {
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    background: #FFFDF7;
    border: 3px solid var(--ink);
    border-radius: clamp(16px, 2vw, 24px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    padding: 4px;
  }

  .room-svg {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    overflow: visible;
  }

  .room-svg.bounce { animation: roomPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes roomPop {
    0% { transform: scale(0.985); }
    50% { transform: scale(1.015); }
    100% { transform: scale(1); }
  }

  .glam-box {
    width: 100%;
    background: #FFFFFF;
    border: 2px solid var(--ink);
    border-radius: 13px;
    padding: clamp(3px, 0.6vh, 6px) clamp(7px, 0.9vw, 11px);
    flex-shrink: 0;
  }

  .glam-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: clamp(2px, 0.35vh, 4px);
    font-size: clamp(0.62rem, min(1.08vw, 1.85vh), 0.84rem);
    font-weight: 700;
  }

  .pct-pill {
    background: #FF6FA5;
    color: #FFFFFF;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: clamp(0.58rem, min(0.98vw, 1.75vh), 0.76rem);
    text-shadow: 0 1px 0 var(--ink);
  }

  .rainbow-track {
    width: 100%;
    height: clamp(9px, 1.7vh, 13px);
    background: #F1F5F9;
    border: 2px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
  }

  .rainbow-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FF6FA5 0%, #FDE047 35%, #6EE7B7 70%, #BAE6FD 100%);
    border-right: 2px solid var(--ink);
    border-radius: 999px;
    transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ================= RIGHT PANE: ROOM SELECTOR + 4 INTERIOR PALETTES ================= */
  .right-pane {
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(5px, 0.8vh, 9px);
  }

  /* Top Room Type Strip (6 Rooms!) */
  .room-selector-box {
    background: #FFFFFF;
    border: clamp(2.2px, 0.3vw, 3.2px) solid var(--ink);
    border-radius: clamp(14px, 1.7vw, 20px);
    box-shadow: 0 3.5px 0 var(--ink);
    padding: clamp(4px, 0.7vh, 8px) clamp(6px, 0.95vw, 11px);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }

  .cloud-tag {
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: clamp(1px, 0.3vh, 2.5px) clamp(6px, 0.85vw, 10px);
    font-size: clamp(0.56rem, min(1vw, 1.8vh), 0.76rem);
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .ct-gold { background: #FDE68A; }
  .ct-pink { background: #FBCFE8; }
  .ct-mint { background: #A7F3D0; }
  .ct-sky  { background: #BAE6FD; }
  .ct-lav  { background: #DDD6FE; }

  .room-tabs-8 {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: clamp(2.5px, 0.45vw, 5px);
  }

  @media (max-width: 720px) {
    .room-tabs-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .room-tab-btn {
    background: #FFFDF7;
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 0 2px 0 var(--ink);
    padding: clamp(2px, 0.45vh, 5px) 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    min-width: 0;
    transition: transform 0.1s;
  }

  .room-tab-btn:active { transform: translateY(1.5px); }

  .room-tab-btn.active {
    background: #FDE047;
    box-shadow: 0 2px 0 var(--ink), 0 0 0 2px #FF6FA5;
    transform: translateY(-1px);
  }

  .room-tab-art {
    width: clamp(22px, min(3.1vw, 4.4vh), 34px);
    height: clamp(22px, min(3.1vw, 4.4vh), 34px);
  }

  .room-tab-name {
    font-size: clamp(0.48rem, min(0.82vw, 1.45vh), 0.68rem);
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* 2x2 Interior Palettes for the Selected Room */
  .palettes-2x2 {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: clamp(5px, 0.85vh, 10px) clamp(6px, 1vw, 12px);
  }

  @media (orientation: portrait) and (max-width: 720px) {
    .palettes-2x2 {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      height: auto;
    }
  }

  .palette-card {
    background: #FFFFFF;
    border: clamp(2.2px, 0.3vw, 3.2px) solid var(--ink);
    border-radius: clamp(14px, 1.7vw, 20px);
    box-shadow: 0 3.5px 0 var(--ink);
    padding: clamp(4px, 0.7vh, 8px) clamp(6px, 0.9vw, 10px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(2px, 0.45vh, 5px);
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }

  .palette-card.theme-pink { background: linear-gradient(180deg, #FFFFFF 0%, #FFF0F7 100%); }
  .palette-card.theme-gold { background: linear-gradient(180deg, #FFFFFF 0%, #FFFBEB 100%); }
  .palette-card.theme-mint { background: linear-gradient(180deg, #FFFFFF 0%, #ECFDF5 100%); }
  .palette-card.theme-sky  { background: linear-gradient(180deg, #FFFFFF 0%, #EFF8FF 100%); }

  .swatch-grid-8 {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: clamp(2.5px, 0.45vh, 5px) clamp(2.5px, 0.45vw, 6px);
    flex: 1 1 auto;
    min-height: 0;
    align-items: stretch;
  }

  .swatch-btn {
    background: #FFFFFF;
    border: 1.9px solid var(--ink);
    border-radius: clamp(10px, 1.2vw, 14px);
    box-shadow: 0 2px 0 var(--ink);
    padding: 2px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    min-width: 0;
    min-height: 0;
    transition: transform 0.1s, background 0.15s;
  }

  .swatch-btn:active { transform: translateY(1.5px); }

  .swatch-btn.active {
    background: #FFF3B0;
    box-shadow: 0 2px 0 var(--ink), 0 0 0 2.2px #FF6FA5;
    transform: translateY(-1px);
  }

  .swatch-art {
    width: clamp(22px, min(3vw, 4.3vh), 34px);
    height: clamp(22px, min(3vw, 4.3vh), 34px);
    flex-shrink: 0;
  }

  .swatch-label {
    font-size: clamp(0.5rem, min(0.86vw, 1.48vh), 0.7rem);
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  #fx-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div class="room-book">
  <!-- Top Header -->
  <div class="header-wrapper">
    <div class="header-bar">
      <div class="room-tag">🏡 Arin's Dream House</div>
      <div class="puffy-title">
        🛋️ <span>ARIN'S</span> <span class="gold">6-ROOM</span> <span class="mint">INTERIOR</span> ✨
      </div>
      <div class="controls-row">
        <button class="sticker-btn mint" id="magic-room-btn">🪄 Cozy Magic!</button>
        <button class="sticker-btn pink" id="clear-room-btn">🧹 Reset Room</button>
        <button class="sticker-btn sky" id="save-html-btn">💾 Save</button>
      </div>
    </div>
  </div>

  <!-- 2-Pane Split Body -->
  <div class="two-pane">
    <!-- Left Pane: Live Room Canvas -->
    <div class="left-pane">
      <div class="cloud-speech" id="speech-bubble">"Choose a room on the right and decorate every corner!" 🏡</div>

      <div class="room-stage" id="room-tap" title="Tap room for sparkles!">
        <svg id="room-svg" class="room-svg" viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
          <!-- Wall -->
          <rect id="room-wall" x="0" y="0" width="420" height="196" fill="#FFF0F7"/>
          <g id="wall-pattern-layer" opacity="0.55"></g>

          <!-- Baseboard -->
          <rect x="0" y="190" width="420" height="8" fill="#FFFFFF" stroke="#3D2B24" stroke-width="2.2"/>

          <!-- Floor -->
          <rect id="room-floor" x="0" y="198" width="420" height="82" fill="#FDE68A" stroke="#3D2B24" stroke-width="2.4"/>
          <g id="floor-lines" stroke="#D97706" stroke-width="1.3" opacity="0.45">
            <line x1="0" y1="224" x2="420" y2="224"/>
            <line x1="0" y1="252" x2="420" y2="252"/>
            <line x1="105" y1="198" x2="105" y2="280"/>
            <line x1="210" y1="198" x2="210" y2="280"/>
            <line x1="315" y1="198" x2="315" y2="280"/>
          </g>

          <!-- Rug Layer -->
          <g id="room-rug-layer"></g>

          <!-- Room Architecture / Window / Backdrop -->
          <g id="room-arch-layer"></g>

          <!-- Main Furniture Layer -->
          <g id="room-furniture-layer"></g>

          <!-- Secondary Furniture / Side Piece -->
          <g id="room-side-layer"></g>

          <!-- Cozy Decor / Lighting / Art Layer -->
          <g id="room-decor-layer"></g>
        </svg>
      </div>

      <div class="glam-box">
        <div class="glam-top">
          <span id="room-summary-label">🛏️ Bedroom · Ready to Style</span>
          <span class="pct-pill" id="room-style-pill">0 / 4 Styled</span>
        </div>
        <div class="rainbow-track">
          <div class="rainbow-fill" id="room-fill"></div>
        </div>
      </div>
    </div>

    <!-- Right Pane: 6 Room Types + 4 Room-Specific Palettes -->
    <div class="right-pane">
      <!-- Top Box: 6 Rooms -->
      <div class="room-selector-box">
        <div class="section-head">
          <span class="cloud-tag ct-gold">🏠 1. Choose Room (8 Rooms · 256 Items!)</span>
          <span id="room-hint" style="font-size:0.72rem;font-weight:700;color:#6B4F43;">Each room has custom furniture!</span>
        </div>
        <div class="room-tabs-8" id="room-tabs"></div>
      </div>

      <!-- Bottom 2x2 Palettes -->
      <div class="palettes-2x2">
        <div class="palette-card theme-pink">
          <div class="card-head">
            <span class="cloud-tag ct-pink">🎨 Walls & Floor</span>
          </div>
          <div class="swatch-grid-8" id="palette-surface"></div>
        </div>

        <div class="palette-card theme-gold">
          <div class="card-head">
            <span class="cloud-tag ct-gold" id="main-cat-title">🛏️ Main Furniture</span>
          </div>
          <div class="swatch-grid-8" id="palette-main"></div>
        </div>

        <div class="palette-card theme-mint">
          <div class="card-head">
            <span class="cloud-tag ct-mint" id="side-cat-title">🪑 Side Furniture</span>
          </div>
          <div class="swatch-grid-8" id="palette-side"></div>
        </div>

        <div class="palette-card theme-sky">
          <div class="card-head">
            <span class="cloud-tag ct-sky" id="decor-cat-title">✨ Room Decor</span>
          </div>
          <div class="swatch-grid-8" id="palette-decor"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const roomTypes = [
    {
      id: 'bedroom',
      name: 'Bedroom',
      tabArt: `<rect x="10" y="22" width="28" height="12" rx="4" fill="#FF8FAB" stroke="#3D2B24" stroke-width="2"/><rect x="12" y="16" width="10" height="7" rx="2" fill="#FFFFFF" stroke="#3D2B24" stroke-width="1.8"/>`,
      defaultWall: '#FFF0F7',
      defaultFloor: '#FDE68A',
      archSvg: `<g transform="translate(34, 28)">
                  <rect x="0" y="0" width="84" height="92" rx="12" fill="#BAE6FD" stroke="#3D2B24" stroke-width="3.2"/>
                  <line x1="42" y1="0" x2="42" y2="92" stroke="#3D2B24" stroke-width="2.8"/>
                  <line x1="0" y1="46" x2="84" y2="46" stroke="#3D2B24" stroke-width="2.8"/>
                  <path d="M -8 -6 L 16 -6 L 10 98 L -10 98 Z" fill="#FF8FAB" stroke="#3D2B24" stroke-width="2.4"/>
                  <path d="M 92 -6 L 68 -6 L 74 98 L 94 98 Z" fill="#FF8FAB" stroke="#3D2B24" stroke-width="2.4"/>
                </g>`,
      mainTitle: '🛏️ Dream Beds (6)',
      sideTitle: '🪞 Vanity & Desk (6)',
      decorTitle: '🧸 Cozy Accents (6)',
      surfaces: [
        { id: 's_pink', label: 'Cotton Pink', wall: '#FFF0F7', dot: '#FF8FAB', floor: '#FDE68A', rug: '#FF8FAB', art: `<rect x="10" y="10" width="28" height="28" rx="7" fill="#FFF0F7" stroke="#3D2B24" stroke-width="2.2"/><circle cx="24" cy="24" r="6" fill="#FF8FAB"/>` },
        { id: 's_sky', label: 'Cloud Blue', wall: '#E0F2FE', dot: '#38BDF8', floor: '#FEF3C7', rug: '#60A5FA', art: `<rect x="10" y="10" width="28" height="28" rx="7" fill="#E0F2FE" stroke="#3D2B24" stroke-width="2.2"/><circle cx="24" cy="24" r="6" fill="#38BDF8"/>` },
        { id: 's_lilac', label: 'Lilac Dream', wall: '#F3E8FF', dot: '#A855F7', floor: '#FDE68A', rug: '#C084FC', art: `<rect x="10" y="10" width="28" height="28" rx="7" fill="#F3E8FF" stroke="#3D2B24" stroke-width="2.2"/><circle cx="24" cy="24" r="6" fill="#A855F7"/>` },

  let currentRoom = roomTypes[0];
  const roomSelections = {};
  roomTypes.forEach(r => {
    roomSelections[r.id] = { surface: null, main: null, side: null, decor: [] };
  });

  function makeMiniSvg(artMarkup, cls = 'swatch-art') {
    return `<svg class="${cls}" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">${artMarkup}</svg>`;
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playDecorSound(step = 1) {
    try {
      const ctx = getAudioCtx();
      const notes = [587.33, 739.99, 880.00, 1174.66];
      const f = notes[(step - 1) % notes.length];
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, ctx.currentTime);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.23);
    } catch (e) {}
  }

  function renderRoomTabs() {
    const tabs = document.getElementById('room-tabs');
    tabs.innerHTML = '';
    roomTypes.forEach(room => {
      const btn = document.createElement('button');
      btn.className = 'room-tab-btn' + (room.id === currentRoom.id ? ' active' : '');
      const sObj = roomSelections[room.id];
      const selCount = [sObj.surface, sObj.main, sObj.side].filter(Boolean).length + (Array.isArray(sObj.decor) ? sObj.decor.length : 0);
      const badge = selCount > 0 ? `(${selCount})` : '';
      btn.innerHTML = `${makeMiniSvg(room.tabArt, 'room-tab-art')}<span class="room-tab-name">${room.name}${badge}</span>`;
      btn.addEventListener('click', () => {
        currentRoom = room;
        playDecorSound(1);
        updateRoomUI(`"Welcome to Arin's ${room.name}! Decorate it your way!" 🏡`);
      });
      tabs.appendChild(btn);
    });
  }

  function renderPalettes() {
    document.getElementById('main-cat-title').textContent = currentRoom.mainTitle;
    document.getElementById('side-cat-title').textContent = currentRoom.sideTitle;
    document.getElementById('decor-cat-title').textContent = currentRoom.decorTitle;

    const sel = roomSelections[currentRoom.id];
    const groups = [
      ['palette-surface', 'surface', currentRoom.surfaces],
      ['palette-main', 'main', currentRoom.main],
      ['palette-side', 'side', currentRoom.side],
      ['palette-decor', 'decor', currentRoom.decor]
    ];

    groups.forEach(([elId, cat, list]) => {
      const box = document.getElementById(elId);
      box.innerHTML = '';
      list.forEach(item => {
        const btn = document.createElement('button');
        const isAct = (cat === 'decor') ? (Array.isArray(sel.decor) && sel.decor.includes(item.id)) : (sel[cat] === item.id);
        btn.className = 'swatch-btn' + (isAct ? ' active' : '');
        btn.innerHTML = `${makeMiniSvg(item.art, 'swatch-art')}<span class="swatch-label">${item.label}</span>`;
        btn.addEventListener('click', () => {
          if (cat === 'decor') {
            if (!Array.isArray(sel.decor)) sel.decor = sel.decor ? [sel.decor] : [];
            if (sel.decor.includes(item.id)) {
              sel.decor = sel.decor.filter(x => x !== item.id);
              updateRoomUI(`"Removed ${item.label} from ${currentRoom.name}!" 🧹`);
            } else {
              if (sel.decor.length >= 4) sel.decor.shift();
              sel.decor.push(item.id);
              playDecorSound(4);
              updateRoomUI(`"Layered ${item.label} (${sel.decor.length}/4 decor)!" ✨`);
            }
          } else {
            if (sel[cat] === item.id) {
              sel[cat] = null;
              updateRoomUI(`"Removed ${item.label} from ${currentRoom.name}!" 🧹`);
            } else {
              sel[cat] = item.id;
              const count = [sel.surface, sel.main, sel.side, (sel.decor && sel.decor.length > 0)].filter(Boolean).length;
              playDecorSound(count);
              updateRoomUI(`"Styled ${currentRoom.name} with ${item.label}!" ✨`);
            }
          }
        });
        box.appendChild(btn);
      });
    });
  }

  function buildWallPattern(surfObj) {
    if (!surfObj) return '';
    let p = '';
    const c = surfObj.dot || '#FF8FAB';
    const pat = surfObj.pat || 'dots';
    if (pat === 'stripes') {
      for (let x = 18; x < 415; x += 28) {
        p += `<rect x="${x}" y="0" width="10" height="190" fill="${c}" opacity="0.35"/>`;
      }
    } else if (pat === 'grid') {
      for (let x = 24; x < 415; x += 32) p += `<line x1="${x}" y1="0" x2="${x}" y2="190" stroke="${c}" stroke-width="2" opacity="0.45"/>`;
      for (let y = 24; y < 188; y += 32) p += `<line x1="0" y1="${y}" x2="420" y2="${y}" stroke="${c}" stroke-width="2" opacity="0.45"/>`;
    } else if (pat === 'diamonds') {
      for (let x = 145; x < 410; x += 38) {
        for (let y = 24; y < 180; y += 38) {
          p += `<polygon points="${x},${y-6} ${x+6},${y} ${x},${y+6} ${x-6},${y}" fill="${c}"/>`;
        }
      }
    } else {
      for (let x = 148; x < 410; x += 36) {
        for (let y = 26; y < 180; y += 36) {
          p += `<circle cx="${x}" cy="${y}" r="3.5" fill="${c}"/>`;
        }
      }
    }
    return p;
  }

  function updateRoomUI(speechText) {
    renderRoomTabs();
    renderPalettes();

    const sel = roomSelections[currentRoom.id];
    const surfObj = currentRoom.surfaces.find(x => x.id === sel.surface) || null;
    const mainObj = currentRoom.main.find(x => x.id === sel.main) || null;
    const sideObj = currentRoom.side.find(x => x.id === sel.side) || null;
    const decorIds = Array.isArray(sel.decor) ? sel.decor : (sel.decor ? [sel.decor] : []);
    const decorObjs = decorIds.map(id => currentRoom.decor.find(x => x.id === id)).filter(Boolean);

    document.getElementById('room-wall').setAttribute('fill', surfObj ? surfObj.wall : currentRoom.defaultWall);
    document.getElementById('wall-pattern-layer').innerHTML = buildWallPattern(surfObj);
    document.getElementById('room-floor').setAttribute('fill', surfObj ? surfObj.floor : currentRoom.defaultFloor);

    document.getElementById('room-rug-layer').innerHTML = surfObj
      ? (surfObj.rugShape === 'star'
          ? `<ellipse cx="215" cy="236" rx="116" ry="25" fill="${surfObj.rug}" stroke="#3D2B24" stroke-width="2.8"/><ellipse cx="215" cy="236" rx="96" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"/>`
          : surfObj.rugShape === 'rect'
          ? `<rect x="108" y="214" width="214" height="44" rx="12" fill="${surfObj.rug}" stroke="#3D2B24" stroke-width="2.8"/><rect x="116" y="220" width="198" height="32" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 5"/>`
          : `<ellipse cx="215" cy="236" rx="112" ry="24" fill="${surfObj.rug}" stroke="#3D2B24" stroke-width="2.8"/>`)
      : '';

    document.getElementById('room-arch-layer').innerHTML = currentRoom.archSvg;
    document.getElementById('room-furniture-layer').innerHTML = mainObj ? mainObj.svg : '';
    document.getElementById('room-side-layer').innerHTML = sideObj ? sideObj.svg : '';
    document.getElementById('room-decor-layer').innerHTML = decorObjs.map(d => d.svg).join('');

    const parts = [surfObj?.label, mainObj?.label, sideObj?.label, ...decorObjs.map(d => d.label)].filter(Boolean);
    document.getElementById('room-summary-label').textContent =
      parts.length ? `${currentRoom.name} · ${parts.slice(0, 4).join(' · ')}` : `${currentRoom.name} · Ready to Style`;

    const doneCount = [surfObj, mainObj, sideObj, decorObjs.length > 0].filter(Boolean).length;
    const pct = Math.round((doneCount / 4) * 100);
    document.getElementById('room-fill').style.width = pct + '%';
    document.getElementById('room-style-pill').textContent = `${doneCount} / 4 Styled`;

    if (speechText) {
      const bubble = document.getElementById('speech-bubble');
      bubble.textContent = speechText;
      bubble.classList.remove('pop');
      void bubble.offsetWidth;
      bubble.classList.add('pop');
    }

    const svg = document.getElementById('room-svg');
    svg.classList.remove('bounce');
    void svg.offsetWidth;
    svg.classList.add('bounce');
  }

  document.getElementById('magic-room-btn').addEventListener('click', () => {
    const sel = roomSelections[currentRoom.id];
    sel.surface = currentRoom.surfaces[Math.floor(Math.random() * currentRoom.surfaces.length)].id;
    sel.main = currentRoom.main[Math.floor(Math.random() * currentRoom.main.length)].id;
    sel.side = currentRoom.side[Math.floor(Math.random() * currentRoom.side.length)].id;
    const shuffled = [...currentRoom.decor].sort(() => Math.random() - 0.5);
    sel.decor = shuffled.slice(0, 3).map(x => x.id);
    playDecorSound(4);
    launchGlitterFireworks();
    updateRoomUI(`"Ta-da! Full ${currentRoom.name} makeover with 3 layered decors!" 🪄🏡`);
  });

  document.getElementById('clear-room-btn').addEventListener('click', () => {
    roomSelections[currentRoom.id] = { surface: null, main: null, side: null, decor: [] };
    updateRoomUI(`"${currentRoom.name} cleared! Start fresh!" 🧹`);
  });

  document.getElementById('room-tap').addEventListener('click', () => {
    playDecorSound(2);
    const svg = document.getElementById('room-svg');
    svg.classList.remove('bounce');
    void svg.offsetWidth;
    svg.classList.add('bounce');
  });

  document.getElementById('save-html-btn').addEventListener('click', () => {
    try {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'arin_dream_house_mega256.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    } catch (e) {}
  });

  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createGlitterBurst(x, y) {
    const colors = ['#FF6FA5', '#FDE047', '#6EE7B7', '#BAE6FD', '#C084FC', '#FB923C'];
    for (let i = 0; i < 46; i++) {
      const angle = (Math.PI * 2 * i) / 46 + (Math.random() - 0.5) * 0.25;
      const speed = 2.4 + Math.random() * 5.6;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 4.5 + Math.random() * 4.5
      });
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.07;
      p.alpha -= 0.013;
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    particles = particles.filter(p => p.alpha > 0);
    if (particles.length > 0) {
      animId = requestAnimationFrame(animateParticles);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      animId = null;
    }
  }

  function launchGlitterFireworks() {
    const w = canvas.width;
    const h = canvas.height;
    createGlitterBurst(w * 0.25, h * 0.28);
    setTimeout(() => createGlitterBurst(w * 0.75, h * 0.25), 200);
    setTimeout(() => createGlitterBurst(w * 0.50, h * 0.20), 400);
    setTimeout(() => createGlitterBurst(w * 0.34, h * 0.45), 620);
    setTimeout(() => createGlitterBurst(w * 0.66, h * 0.43), 820);
    if (!animId) animateParticles();
  }

  updateRoomUI();
</script>
</body>
</html>
